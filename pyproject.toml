[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-codex"
version = "0.1.0"
description = "Persistent local Codex task service with Feishu and terminal clients"
requires-python = ">=3.12"
dependencies = ["lark-oapi==1.7.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "jsonschema>=4,<5", "ruff>=0.17,<0.18"]

[project.scripts]
feishu-codex = "feishu_codex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
